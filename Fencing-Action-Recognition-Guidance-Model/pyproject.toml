[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fencing-evidence-coach"
version = "0.1.0"
description = "Evidence-linked fencing movement analysis and PDF coaching reports"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "reportlab>=4.0,<5"]

[project.optional-dependencies]
vision = ["mediapipe==0.10.21", "opencv-contrib-python==4.11.0.86"]
app = ["streamlit==1.49.1", "pyarrow==20.0.0"]
sword = ["ultralytics==8.4.215", "opencv-python==4.11.0.86"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pypdf>=5,<7"]

[project.scripts]
fencing-coach = "fencing_coach.cli:main"

[tool.setuptools.packages.find]
include = ["fencing_coach*"]

[tool.setuptools.package-data]
fencing_coach = ["rubric.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
